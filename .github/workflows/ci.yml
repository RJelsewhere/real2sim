name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -d robotics
          test -d perception
          test -d backend
          test -d simulation
          test -d docs/contracts
          test -d tests
      - name: Validate JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("docs/contracts").glob("*.json"):
              json.loads(path.read_text())
              print(f"valid: {path}")
          PY
